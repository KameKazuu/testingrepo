name: Format

on:
  workflow_dispatch:

permissions:
  contents: write

# Skip the local pre-push conformance hook; this job's whole purpose is to fix
# formatting, so it must be able to push the fix.
env:
  HUSKY: "0"

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files
        run: npx oxfmt . '!bundles/**'

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Format files"
          git push
